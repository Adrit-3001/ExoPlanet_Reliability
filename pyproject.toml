[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exoreliability"
version = "0.1.0"
description = "Reliability study of ML exoplanet-transit detection on Kepler light curves."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "astropy>=6.0",
    "astroquery>=0.4.7",
    "lightkurve>=2.4",
    "httpx>=0.27",
    "pyarrow>=15",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
]
# PyTorch is intentionally not a core dependency until Milestone 3 (CNN baseline).
ml = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "network: test requires internet access (not run by default)",
]
filterwarnings = [
    "ignore::DeprecationWarning:lightkurve.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PTH", "SIM", "RUF"]
# Line length is enforced by `ruff format`; long string literals are allowed.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"apps/api/routers/*.py" = ["B008"]

[tool.mypy]
# numpy>=2.3 stubs use 3.12 syntax, so type-check as 3.12 (runtime still supports 3.11).
python_version = "3.12"
files = ["src", "apps/api"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
